name: Prepare social sharing logo

on:
  push:
    paths:
      - '.github/workflows/prepare-sharing-logo.yml'
      - 'assets/logo.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Convert embedded logo to JPG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image
          svg = Path("assets/logo.svg").read_text(encoding="utf-8")
          match = re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', svg)
          if not match:
              raise SystemExit("Could not find the embedded WebP logo in assets/logo.svg")
          raw = base64.b64decode(match.group(1))
          image = Image.open(io.BytesIO(raw)).convert("RGB")
          image.save("assets/logo-share.jpg", "JPEG", quality=88, optimize=True, progressive=True)
          print("Created assets/logo-share.jpg", Path("assets/logo-share.jpg").stat().st_size, "bytes", image.size)
          PY
      - name: Commit sharing image
        run: |
          if git diff --quiet -- assets/logo-share.jpg; then
            echo "Sharing logo is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-share.jpg
          git commit -m "Create JPG logo for social sharing previews"
          git push
